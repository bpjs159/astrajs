<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="https://astrajs.dev/favicon.png" />
  <title>AstraDash — Real-time Dashboard · AstraJS</title>
  <meta name="description" content="AstraDash: a real-time analytics dashboard built with AstraJS — autoSync live data, streaming AI insights, file uploads and resumability." />
  <style>
    @font-face{font-family:'Fauna Pro';src:url('https://astrajs.dev/fonts/fauna/FaunaPro-Regular.ttf') format('truetype');font-weight:400;font-style:normal}
    @font-face{font-family:'Fauna Pro';src:url('https://astrajs.dev/fonts/fauna/FaunaPro-Medium.ttf') format('truetype');font-weight:500;font-style:normal}
    @font-face{font-family:'Fauna Pro';src:url('https://astrajs.dev/fonts/fauna/FaunaPro-Semibold.ttf') format('truetype');font-weight:600;font-style:normal}
    @font-face{font-family:'Fauna Pro';src:url('https://astrajs.dev/fonts/fauna/FaunaPro-Bold.ttf') format('truetype');font-weight:700;font-style:normal}
    :root {
      --bg: #04060d; --bg2: #0a0f1a; --card: rgba(255,255,255,.03); --line: rgba(255,255,255,.08);
      --text: #e2e8f0; --muted: #94a3b8; --accent: #8d4dff; --accent2: #00dfff;
      --danger: #f87171; --ok: #34d399; --warn: #fbbf24;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { overflow-x: clip; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      line-height: 1.6; padding-top: 64px;
    }
    code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    ::selection { background: rgba(139,77,255,.3); color: #fff; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f1a; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* ── Header ─────────────────────────────────────────── */
    header.site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; align-items: center; gap: 16px;
      padding: 0 24px; height: 64px;
      background: rgba(4,6,13,.55); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .brand-logo {
      font-family: 'Fauna Pro', serif; font-weight: 500; font-size: 1.1rem; letter-spacing: .04em; color: #fff;
      display: inline-flex; align-items: center; cursor: pointer; line-height: 1;
    }
    .brand-logo .bl-first { position: relative; display: inline-block; }
    .brand-logo .bl-star {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-52%);
      height: 1.5em; pointer-events: none;
    }
    .brand-logo .bl-star img { height: 100%; width: auto; max-width: none; display: block; }
    .brand-logo .bl-js {
      background: linear-gradient(135deg,#8d4dff,#4d7cff);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .brand-logo .brand-sub {
      margin-left: 10px; font-size: .62rem; font-weight: 700; color: #c4a0ff;
      background: rgba(139,77,255,.12); border: 1px solid rgba(139,77,255,.35);
      border-radius: 999px; padding: 2px 8px; letter-spacing: .06em; text-transform: uppercase;
    }
    nav.site-nav { display: flex; gap: 2px; flex: 1; }
    nav.site-nav a {
      color: #94a3b8; text-decoration: none; padding: 7px 14px;
      border-radius: 8px; font-size: .82rem; font-weight: 500; cursor: pointer;
      transition: color .15s, background .15s;
    }
    nav.site-nav a:hover { color: #e2e8f0; background: rgba(255,255,255,.05); }
    .header-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .docs-link {
      color: #c4a0ff; text-decoration: none; font-size: .78rem; font-weight: 700;
      padding: 7px 12px; border-radius: 999px;
      background: rgba(139,77,255,.1); border: 1px solid rgba(139,77,255,.35);
      box-shadow: 0 0 12px rgba(139,77,255,.25); white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    .docs-link:hover { background: rgba(139,77,255,.2); border-color: rgba(139,77,255,.6); }
    .lang-select {
      background: rgba(255,255,255,.03); color: #94a3b8; border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px; padding: 7px 10px; font-size: .78rem; font-weight: 600; cursor: pointer;
    }
    .lang-select:hover { color: #e2e8f0; border-color: rgba(255,255,255,.25); }
    .lang-select option { background: #060b14; color: #e2e8f0; }

    main.site-main { flex: 1; padding: 36px 24px 72px; max-width: 1100px; width: 100%; margin: 0 auto; }
    footer.site-footer {
      border-top: 1px solid rgba(255,255,255,.06); padding: 22px 24px;
      color: #64748b; font-size: 13px; text-align: center; background: #060b14;
    }
    footer.site-footer a { color: #8d4dff; text-decoration: none; }

    /* ── Hero ───────────────────────────────────────────── */
    .hero {
      background:
        radial-gradient(900px 420px at 85% -20%, rgba(139,77,255,.10) 0%, transparent 70%),
        radial-gradient(700px 360px at 10% 110%, rgba(0,223,255,.06) 0%, transparent 70%),
        linear-gradient(135deg, rgba(139,77,255,.06), rgba(255,255,255,.01));
      border: 1px solid rgba(255,255,255,.07); border-radius: 24px; padding: 44px 40px;
      display: flex; flex-wrap: wrap; gap: 28px; align-items: center; justify-content: space-between;
    }
    .hero h1 { font-size: 2.2rem; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; color: #f7f7ff; }
    .hero h1 span {
      background: linear-gradient(135deg,#b84cff 0%,#4d7cff 50%,#00dfff 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .hero p { color: #94a3b8; margin-top: 10px; max-width: 560px; }
    .live-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(52,211,153,.08); border: 1px solid rgba(52,211,153,.25);
      color: #34d399; font-size: .72rem; font-weight: 700;
      padding: 7px 14px; border-radius: 999px; letter-spacing: .04em;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #34d399;
      box-shadow: 0 0 8px rgba(52,211,153,.9); animation: pulse 1.6s ease infinite;
    }
    @keyframes pulse { 50% { opacity: .35; } }

    section.block { margin: 36px 0; }
    h2.section-title { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 6px; color: #f7f7ff; }
    .section-sub { color: #94a3b8; font-size: .82rem; margin-bottom: 18px; max-width: 680px; }

    /* ── KPI cards ──────────────────────────────────────── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
    .kpi {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 20px 22px; position: relative; overflow: hidden;
    }
    .kpi::before {
      content: ''; position: absolute; inset: 0 0 auto 0; height: 2px;
      background: linear-gradient(90deg,#b84cff,#4d7cff,#00dfff); opacity: .55;
    }
    .kpi-label { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #64748b; }
    .kpi-value {
      font-size: 2rem; font-weight: 800; color: #f7f7ff; line-height: 1.2;
      font-variant-numeric: tabular-nums; letter-spacing: -.02em;
    }
    .kpi-delta { font-size: .72rem; font-weight: 600; color: #34d399; }

    /* ── Live chart ─────────────────────────────────────── */
    .chart-card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px;
    }
    .chart-card .chart-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chart-card h3 { font-size: 1rem; font-weight: 700; color: #f7f7ff; }
    .chart-card .chart-last { font-size: .74rem; color: #94a3b8; font-variant-numeric: tabular-nums; }
    .chart-bars { display: flex; align-items: flex-end; gap: 5px; height: 160px; }
    .chart-col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; min-width: 0; }
    .chart-bar {
      width: 100%; border-radius: 4px 4px 0 0;
      background: linear-gradient(180deg,#8d4dff,#4d7cff);
      opacity: .85; transition: height .4s cubic-bezier(.2,.8,.3,1);
      box-shadow: 0 0 14px rgba(139,77,255,.25);
    }
    .chart-label { font-size: .58rem; color: #475569; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* ── Panels: AI + Upload ────────────────────────────── */
    .panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media (max-width: 860px) { .panel-grid { grid-template-columns: 1fr; } }
    .panel {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 24px; display: flex; flex-direction: column; gap: 14px;
    }
    .panel h3 { font-size: 1rem; font-weight: 700; color: #f7f7ff; }
    .panel .panel-sub { font-size: .78rem; color: #94a3b8; line-height: 1.55; }
    .panel textarea, .panel input[type="text"] {
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px; color: #e2e8f0; padding: 12px 14px; font-size: .85rem;
      font-family: inherit; outline: none; resize: vertical; min-height: 74px;
      transition: border-color .15s;
    }
    .panel textarea:focus { border-color: rgba(139,77,255,.6); }
    .btn {
      display: inline-block; border: none; cursor: pointer; text-decoration: none;
      background: linear-gradient(135deg,#8d4dff,#4d7cff); color: #fff; font-weight: 600; font-size: 14px;
      border-radius: 10px; padding: 11px 24px;
      transition: opacity .15s, transform .15s, box-shadow .15s;
    }
    .btn:hover { opacity: .92; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(139,77,255,.35); }
    .btn.ghost { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12); color: #e2e8f0; }
    .btn.ghost:hover { background: rgba(255,255,255,.08); box-shadow: none; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
    .ai-answer {
      background: rgba(255,255,255,.02); border: 1px solid rgba(255,255,255,.06);
      border-radius: 10px; padding: 14px 16px; font-size: .84rem; line-height: 1.7;
      color: #cbd5e1; white-space: pre-wrap; min-height: 90px;
    }
    .cursor { display: inline-block; width: 7px; height: 14px; background: #34d399; vertical-align: -2px; margin-left: 3px; animation: blink 1s steps(2) infinite; }
    .cursor.off { display: none; }
    @keyframes blink { 50% { opacity: 0; } }
    .ai-status { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #64748b; }
    .ai-status.streaming { color: #34d399; }
    .ai-status.error { color: #f87171; }

    /* Upload */
    .drop-zone {
      border: 1.5px dashed rgba(255,255,255,.18); border-radius: 12px;
      padding: 22px; text-align: center; color: #94a3b8; font-size: .8rem;
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .drop-zone:hover { border-color: rgba(139,77,255,.55); background: rgba(139,77,255,.04); }
    .drop-zone input { display: none; }
    .progress { height: 8px; border-radius: 999px; background: rgba(255,255,255,.06); overflow: hidden; }
    .progress-fill {
      height: 100%; width: 0%; border-radius: 999px;
      background: linear-gradient(90deg,#8d4dff,#00dfff);
      transition: width .2s ease;
    }
    .upload-meta { font-size: .72rem; color: #64748b; display: flex; justify-content: space-between; }
    .report {
      background: rgba(52,211,153,.06); border: 1px solid rgba(52,211,153,.2);
      border-radius: 10px; padding: 12px 16px; font-size: .78rem; color: #a7f3d0;
      display: flex; flex-wrap: wrap; gap: 6px 18px;
    }
    .report strong { color: #d1fae5; }
    .upload-error { color: #f87171; font-size: .78rem; }

    /* ── Resumability island ────────────────────────────── */
    .resume-demo { margin-top: 36px; }
    .resume-card {
      background: linear-gradient(135deg, rgba(139,77,255,.07), rgba(255,255,255,.01));
      border: 1px solid rgba(139,77,255,.28); border-radius: 16px; padding: 24px;
    }
    .resume-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
    .resume-head h3 { font-size: 1rem; font-weight: 700; color: #f7f7ff; }
    .resume-head p { font-size: .78rem; color: #94a3b8; max-width: 640px; margin-top: 4px; }
    .resume-pill {
      margin-left: auto; font-size: .68rem; font-weight: 800; letter-spacing: .05em;
      color: #c4a0ff; background: rgba(139,77,255,.12); border: 1px solid rgba(139,77,255,.4);
      border-radius: 999px; padding: 4px 12px; white-space: nowrap;
    }
    .resume-body { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; margin-top: 16px; }
    .resume-counter { display: flex; align-items: center; gap: 14px; }
    .resume-views {
      font-size: 2rem; font-weight: 800; color: #f7f7ff; min-width: 90px;
      text-align: center; font-variant-numeric: tabular-nums;
      background: rgba(255,255,255,.04); border-radius: 10px; padding: 6px 14px;
      border: 1px solid rgba(255,255,255,.1);
    }
    .resume-note { font-size: .74rem; color: #64748b; max-width: 520px; }
    .resume-note code { color: #c4a0ff; font-size: .7rem; }
    .feature-strip { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
    .feature-tag {
      font-size: .68rem; font-weight: 600; color: #b84cff;
      background: rgba(139,77,255,.08); border: 1px solid rgba(139,77,255,.18);
      padding: 3px 11px; border-radius: 999px;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
