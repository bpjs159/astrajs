<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="https://astrajs.dev/favicon.png" />
  <title>AstraStore — eCommerce SSR · AstraJS</title>
  <meta name="description" content="AstraStore: a complete SSR eCommerce demo built with AstraJS — server-rendered catalog, typed RPC, ISR, auth and an AI shopping assistant." />
  <style>
    @font-face{font-family:'Fauna Pro';src:url('https://astrajs.dev/fonts/fauna/FaunaPro-Regular.ttf') format('truetype');font-weight:400;font-style:normal}
    @font-face{font-family:'Fauna Pro';src:url('https://astrajs.dev/fonts/fauna/FaunaPro-Medium.ttf') format('truetype');font-weight:500;font-style:normal}
    @font-face{font-family:'Fauna Pro';src:url('https://astrajs.dev/fonts/fauna/FaunaPro-Semibold.ttf') format('truetype');font-weight:600;font-style:normal}
    @font-face{font-family:'Fauna Pro';src:url('https://astrajs.dev/fonts/fauna/FaunaPro-Bold.ttf') format('truetype');font-weight:700;font-style:normal}
    :root {
      --bg: #04060d; --bg2: #0a0f1a; --card: rgba(255,255,255,.03); --line: rgba(255,255,255,.08);
      --text: #e2e8f0; --muted: #94a3b8; --accent: #8d4dff; --accent2: #00dfff;
      --danger: #f87171; --ok: #34d399;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { overflow-x: clip; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      line-height: 1.6; padding-top: 64px;
    }
    code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    ::selection { background: rgba(139,77,255,.3); color: #fff; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f1a; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    .site { display: flex; flex-direction: column; min-height: 100vh; }
    header.site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      display: flex; align-items: center; gap: 16px;
      padding: 0 24px; height: 64px;
      background: rgba(4,6,13,.55); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .brand-logo {
      font-family: 'Fauna Pro', serif; font-weight: 500; font-size: 1.1rem; letter-spacing: .04em; color: #fff;
      display: inline-flex; align-items: center; cursor: pointer; line-height: 1;
    }
    .brand-logo .bl-first { position: relative; display: inline-block; }
    .brand-logo .bl-star {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%,-52%);
      height: 1.5em; pointer-events: none;
    }
    .brand-logo .bl-star img { height: 100%; width: auto; max-width: none; display: block; }
    .brand-logo .bl-js {
      background: linear-gradient(135deg,#8d4dff,#4d7cff);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .brand-logo .brand-sub {
      margin-left: 10px; font-size: .62rem; font-weight: 700; color: #c4a0ff;
      background: rgba(139,77,255,.12); border: 1px solid rgba(139,77,255,.35);
      border-radius: 999px; padding: 2px 8px; letter-spacing: .06em; text-transform: uppercase;
    }
    nav.site-nav { display: flex; gap: 2px; flex: 1; }
    nav.site-nav a, .link {
      color: #94a3b8; text-decoration: none; padding: 7px 14px;
      border-radius: 8px; font-size: .82rem; font-weight: 500; cursor: pointer;
      transition: color .15s, background .15s;
    }
    nav.site-nav a:hover, nav.site-nav a.active { color: #e2e8f0; background: rgba(255,255,255,.05); }
    .cart-badge {
      background: linear-gradient(135deg,#8d4dff,#4d7cff); color: #fff; font-size: 11px; font-weight: 700;
      border-radius: 999px; padding: 2px 7px; margin-left: 6px;
    }
    .lang-select {
      background: rgba(255,255,255,.03); color: #94a3b8; border: 1px solid rgba(255,255,255,.1);
      border-radius: 8px; padding: 7px 10px; font-size: .78rem; font-weight: 600; cursor: pointer;
    }
    .lang-select:hover { color: #e2e8f0; border-color: rgba(255,255,255,.25); }
    .lang-select option { background: #060b14; color: #e2e8f0; }
    .header-right { display: flex; align-items: center; gap: 10px; margin-left: auto; }
    .docs-link {
      color: #c4a0ff; text-decoration: none; font-size: .78rem; font-weight: 700;
      padding: 7px 12px; border-radius: 999px;
      background: rgba(139,77,255,.1); border: 1px solid rgba(139,77,255,.35);
      box-shadow: 0 0 12px rgba(139,77,255,.25); white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    .docs-link:hover { background: rgba(139,77,255,.2); border-color: rgba(139,77,255,.6); }
    main.site-main { flex: 1; padding: 36px 24px 72px; max-width: 1100px; width: 100%; margin: 0 auto; }
    footer.site-footer {
      border-top: 1px solid rgba(255,255,255,.06); padding: 22px 24px;
      color: #64748b; font-size: 13px; text-align: center; background: #060b14;
    }
    .hero {
      background:
        radial-gradient(900px 420px at 85% -20%, rgba(139,77,255,.10) 0%, transparent 70%),
        radial-gradient(700px 360px at 10% 110%, rgba(0,223,255,.06) 0%, transparent 70%),
        linear-gradient(135deg, rgba(139,77,255,.06), rgba(255,255,255,.01));
      border: 1px solid rgba(255,255,255,.07); border-radius: 24px; padding: 44px 40px;
      display: flex; flex-wrap: wrap; gap: 28px; align-items: center; justify-content: space-between;
    }
    .hero h1 { font-size: 2.2rem; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; color: #f7f7ff; }
    .hero h1 span {
      background: linear-gradient(135deg,#b84cff 0%,#4d7cff 50%,#00dfff 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .hero p { color: #94a3b8; margin-top: 10px; max-width: 540px; }
    .btn {
      display: inline-block; border: none; cursor: pointer; text-decoration: none;
      background: linear-gradient(135deg,#8d4dff,#4d7cff); color: #fff; font-weight: 600; font-size: 14px;
      border-radius: 10px; padding: 11px 24px;
      transition: opacity .15s, transform .15s, box-shadow .15s;
    }
    .btn:hover { opacity: .92; transform: translateY(-2px); box-shadow: 0 8px 30px rgba(139,77,255,.35); }
    .btn.ghost { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.12); color: #e2e8f0; }
    .btn.ghost:hover { background: rgba(255,255,255,.08); box-shadow: none; }
    .btn.danger { background: var(--danger); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: none; }
    section.block { margin: 36px 0; }
    h2.section-title { font-size: 1.3rem; font-weight: 800; letter-spacing: -.02em; margin-bottom: 16px; color: #f7f7ff; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 16px;
      padding: 18px; cursor: pointer; transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
      display: flex; flex-direction: column; gap: 8px;
    }
    .card:hover { transform: translateY(-3px); border-color: rgba(139,77,255,.4); box-shadow: 0 12px 40px rgba(139,77,255,.12); }
    .card .emoji { font-size: 40px; }
    .card .name { font-weight: 700; color: #e2e8f0; }
    .card .meta { color: #94a3b8; font-size: 13px; display: flex; justify-content: space-between; }
    .price { color: #b9a5ff; font-weight: 700; font-size: 16px; }
    .stock { font-size: 12px; color: #64748b; }
    .stock.low { color: var(--danger); }
    .pill {
      display: inline-block; font-size: 12px; border-radius: 999px; padding: 4px 12px;
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.1);
      color: #94a3b8; margin: 0 4px 8px 0; cursor: pointer; font-weight: 600; transition: all .15s;
    }
    .pill:hover { color: #e2e8f0; border-color: rgba(255,255,255,.25); }
    .pill.active { border-color: rgba(139,77,255,.5); color: #c4a0ff; background: rgba(139,77,255,.12); }
    .search { width: 100%; max-width: 420px; margin-bottom: 18px; }
    input[type=text], input[type=email], textarea {
      background: #0a0f1a; border: 1px solid rgba(255,255,255,.1); color: #e2e8f0;
      border-radius: 10px; padding: 11px 14px; font-size: 14px; width: 100%;
      font-family: inherit; outline: none; transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus { border-color: rgba(139,77,255,.5); box-shadow: 0 0 0 3px rgba(139,77,255,.12); }
    .product-page { display: grid; grid-template-columns: 280px 1fr; gap: 32px; align-items: start; }
    .product-page .big-emoji { font-size: 120px; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 40px; }
    .product-page h1 { font-size: 1.9rem; font-weight: 800; letter-spacing: -.02em; color: #f7f7ff; }
    .product-page .desc { color: #94a3b8; margin: 12px 0; }
    ul.features { list-style: none; margin: 14px 0; }
    ul.features li { padding: 6px 0 6px 24px; position: relative; color: #94a3b8; }
    ul.features li::before { content: '✓'; position: absolute; left: 0; color: var(--ok); }
    .row { display: flex; align-items: center; gap: 14px; }
    .cart-line { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,.06); }
    .cart-line .qty { display: flex; align-items: center; gap: 8px; }
    .qty button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: #e2e8f0; cursor: pointer; }
    .totals { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-top: 18px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 620px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
    .form-field label { font-size: 13px; color: #94a3b8; font-weight: 600; }
    .err { color: var(--danger); font-size: 12px; min-height: 16px; }
    .notice { border-radius: 12px; padding: 14px 18px; font-size: 14px; margin: 14px 0; color: #94a3b8; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); }
    .notice.ok { background: rgba(52,211,153,.08); border-color: rgba(52,211,153,.3); color: #34d399; }
    .notice.bad { background: rgba(248,113,113,.08); border-color: rgba(248,113,113,.3); color: #f87171; }
    .assistant { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; }
    .assistant textarea { min-height: 70px; }
    .assistant .answer { margin-top: 14px; padding: 14px; background: #0a0f1a; border-radius: 12px; font-size: 14px; white-space: pre-wrap; color: #cbd5e1; }
    .order-card { border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 16px; margin-bottom: 12px; background: var(--card); }
    .chip { font-size: 11px; border-radius: 999px; padding: 2px 8px; font-weight: 700; }
    .chip.paid { background: rgba(52,211,153,.12); color: #34d399; }
    .chip.pending { background: rgba(255,200,80,.12); color: #ffc850; }
    .chip.shipped { background: rgba(139,77,255,.15); color: #b9a5ff; }
    .breadcrumb { color: #64748b; font-size: 13px; margin-bottom: 18px; }
    .breadcrumb a { color: #94a3b8; cursor: pointer; }
    .breadcrumb a:hover { color: #c4a0ff; }
    @media (max-width: 760px) {
      .product-page { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      nav.site-nav { display: none; }
      main.site-main { padding: 28px 16px 56px; }
    }
  </style>
</head>
<body>
  <div class="site">
    <div id="app"></div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
