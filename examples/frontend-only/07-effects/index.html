<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 — Effects & Cleanup · AstraJS</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#1e293b; border:1px solid #334155; border-radius:16px; padding:36px;
            max-width:600px; width:100%; }
    h1 { font-size:1.6rem; margin-bottom:4px; }
    .subtitle { color:#64748b; font-size:.85rem; margin-bottom:24px; }
    .timer-display { text-align:center; padding:28px; background:#0f172a; border-radius:14px; margin-bottom:20px; }
    .timer-display .time { font-size:4rem; font-weight:800; color:#818cf8; font-family:'JetBrains Mono',monospace; }
    .timer-display .status { font-size:.85rem; margin-top:4px; }
    .status-running { color:#34d399; }
    .status-stopped { color:#64748b; }
    .btn-row { display:flex; gap:8px; justify-content:center; margin-bottom:20px; }
    .btn { padding:10px 20px; border:none; border-radius:8px; font-weight:600; cursor:pointer;
           font-size:.85rem; transition:all .15s; }
    .btn-start { background:#10b981; color:#fff; }
    .btn-start:hover { background:#059669; }
    .btn-stop { background:#ef4444; color:#fff; }
    .btn-stop:hover { background:#dc2626; }
    .btn-reset { background:#334155; color:#cbd5e1; }
    .btn-reset:hover { background:#475569; }
    .log-panel { background:#0f172a; border-radius:10px; padding:14px; font-family:monospace;
                 font-size:.75rem; max-height:160px; overflow-y:auto; }
    .log-panel .created { color:#818cf8; }
    .log-panel .tick { color:#94a3b8; }
    .log-panel .cleanup { color:#f87171; }
    .highlight { color:#34d399; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app.tsx"></script>
</body>
</html>
