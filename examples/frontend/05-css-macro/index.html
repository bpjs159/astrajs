<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>05 — CSS Macro · AstraJS</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .container { max-width: 700px; padding: 40px; }
    h1 { font-size: 2rem; margin-bottom: 8px; text-align:center; }
    .subtitle { text-align:center; color: #64748b; margin-bottom: 32px; }
    .demo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    /* These classes simulate what css`...` would generate at build time */
    .card { padding: 32px; border-radius: 16px; text-align: center; transition: background .3s, color .3s, box-shadow .3s; cursor: pointer;
            --bg: #ffffff; --text: #1e293b; --text-secondary: #64748b; --accent: #6366f1; --border: #e2e8f0;
            background: var(--bg); color: var(--text); border: 1px solid var(--border); }
    .card[data-theme="dark"] { --bg: #1e293b; --text: #f1f5f9; --text-secondary: #94a3b8; --accent: #818cf8; --border: #334155; }
    @media (prefers-color-scheme: dark) { .card[data-theme="system"] { --bg: #1e293b; --text: #f1f5f9; --text-secondary: #94a3b8; --accent: #818cf8; --border: #334155; } }
    .card:hover { box-shadow: 0 4px 24px rgba(0,0,0,.12); }
    .card h2 { font-size: 1.4rem; margin-bottom: 4px; color: var(--text); }
    .card .badge { display: inline-block; background: var(--accent); color: #fff; padding: 4px 14px; border-radius: 20px; font-size: .75rem; font-weight: 600; margin-bottom: 12px; }
    .card p { font-size: .9rem; color: var(--text-secondary); }
    .code-block { background: #1e293b; border: 1px solid #334155; border-radius: 14px;
                  padding: 24px; overflow-x: auto; display: flex; align-items: center; }
    .code-block pre { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: .82rem;
                      color: #94a3b8; line-height: 1.7; margin: 0; }
    .code-block .kw { color: #818cf8; }
    .code-block .str { color: #34d399; }
    .code-block .fn { color: #fbbf24; }
    .highlight { color: #f472b6; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/app.tsx"></script>
</body>
</html>
