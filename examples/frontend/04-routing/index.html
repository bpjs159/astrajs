<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>04 — Routing · AstraJS</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height:100vh; }
    .shell { display: flex; min-height: 100vh; }
    nav { width: 220px; background: #1e293b; padding: 24px 16px; border-right: 1px solid #334155; }
    nav h2 { font-size: 1.1rem; margin-bottom: 20px; color: #818cf8; }
    nav a { display: block; padding: 10px 14px; border-radius: 8px; color: #94a3b8;
            text-decoration: none; font-weight: 500; margin-bottom: 4px; transition: all .15s; }
    nav a:hover { background: #334155; color: #e2e8f0; }
    nav a.active { background: rgba(99,102,241,.2); color: #818cf8; }
    main { flex:1; padding: 40px; display:flex; align-items:center; justify-content:center; }
    .page { text-align: center; }
    .page .emoji { font-size: 5rem; margin-bottom: 16px; }
    .page h1 { font-size: 2rem; margin-bottom: 8px; }
    .page p { color: #64748b; max-width: 400px; margin: 0 auto; }
    .page .badge { display: inline-block; background: #6366f1; color: #fff; padding: 4px 12px;
                   border-radius: 20px; font-size: .75rem; font-weight: 600; margin-top: 16px; }
  </style>
</head>
<body>
  <div id="app" class="shell"></div>
  <script type="module" src="/src/app.tsx"></script>
</body>
</html>
