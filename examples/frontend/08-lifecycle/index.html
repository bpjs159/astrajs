<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>08 Lifecycle AstraJS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 36px;
            text-align: center;
            min-width: 380px
        }

        h1 {
            font-size: 1.6rem;
            margin-bottom: 4px
        }

        .subtitle {
            color: #64748b;
            font-size: .85rem;
            margin-bottom: 24px
        }

        .timer {
            font-size: 4rem;
            font-weight: 800;
            color: #818cf8;
            font-family: monospace;
            margin: 16px 0
        }

        .log {
            background: #0f172a;
            border-radius: 10px;
            padding: 12px;
            font-family: monospace;
            font-size: .75rem;
            max-height: 120px;
            overflow-y: auto;
            text-align: left;
            margin-top: 20px
        }

        .log .mount {
            color: #34d399
        }

        .log .unmount {
            color: #f87171
        }

        .log .tick {
            color: #94a3b8
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: .9rem;
            margin: 4px
        }

        .btn-toggle {
            background: #6366f1;
            color: #fff
        }

        .btn-toggle:hover {
            background: #4f46e5
        }

        .btn-reset {
            background: #334155;
            color: #cbd5e1
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="/src/app.tsx"></script>
</body>

</html>
