<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>08 — SWR & AutoSync · AstraJS</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0;
           display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .card { background:#1e293b; border:1px solid #334155; border-radius:16px; padding:36px;
            max-width:560px; width:100%; }
    h1 { font-size:1.6rem; margin-bottom:4px; }
    .subtitle { color:#64748b; font-size:.85rem; margin-bottom:24px; }
    .metric { display:flex; justify-content:space-between; align-items:center;
              background:#0f172a; border-radius:10px; padding:16px; margin-bottom:12px; }
    .metric .label { font-size:.85rem; color:#94a3b8; }
    .metric .value { font-size:1.5rem; font-weight:800; color:#818cf8; }
    .metric .age { font-size:.7rem; color:#64748b; }
    .status { display:flex; gap:8px; align-items:center; margin-top:8px; }
    .dot { width:8px; height:8px; border-radius:50%; }
    .dot-stale { background:#fbbf24; }
    .dot-fresh { background:#34d399; }
    .dot-syncing { background:#6366f1; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .btn { padding:10px 20px; border:none; border-radius:8px; font-weight:600; cursor:pointer;
           margin:4px; font-size:.85rem; transition:all .15s; }
    .btn-refresh { background:#6366f1; color:#fff; }
    .btn-refresh:hover { background:#4f46e5; }
    .btn-invalidate { background:#ef4444; color:#fff; }
    .btn-invalidate:hover { background:#dc2626; }
    .btn-auto { background:#10b981; color:#fff; }
    .btn-auto:hover { background:#059669; }
    .log { margin-top:20px; background:#0f172a; border-radius:10px; padding:12px;
           font-family:monospace; font-size:.75rem; max-height:120px; overflow-y:auto; }
    .log div { padding:2px 0; }
    .log .stale { color:#fbbf24; }
    .log .fresh { color:#34d399; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
