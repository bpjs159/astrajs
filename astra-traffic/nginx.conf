# astra-traffic — vhost de nginx con HTTP Basic Auth.
#
# Copiar a /etc/nginx/sites-available/traffic-astrajs y enlazar:
#   sudo ln -s /etc/nginx/sites-available/traffic-astrajs /etc/nginx/sites-enabled/
#
# Crear el archivo de credenciales (usuario: astra, password: 20141020053):
#   printf "astra:%s\n" "$(openssl passwd -apr1 20141020053)" | sudo tee /etc/nginx/.traffic_htpasswd
#   sudo chmod 640 /etc/nginx/.traffic_htpasswd
#   sudo chown root:www-data /etc/nginx/.traffic_htpasswd
#
# Recargar nginx:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name traffic.astrajs.dev;

    # ── HTTP Basic Auth ─────────────────────────────────────────────
    auth_basic "AstraTraffic — Restringido";
    auth_basic_user_file /etc/nginx/.traffic_htpasswd;

    location / {
        proxy_pass http://127.0.0.1:5304;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
