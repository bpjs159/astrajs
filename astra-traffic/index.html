<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AstraTraffic — Nginx Traffic · AstraJS</title>
  <meta name="description" content="AstraTraffic: dashboard de tráfico Nginx construido con AstraJS — lee el access log y muestra KPIs, gráficos y top IPs/rutas en tiempo real." />
  <style>
    :root {
      --bg: #04060d; --bg2: #0a0f1a; --card: rgba(255,255,255,.03); --line: rgba(255,255,255,.08);
      --text: #e2e8f0; --muted: #94a3b8; --accent: #8d4dff; --accent2: #00dfff;
      --ok: #34d399; --warn: #fbbf24; --danger: #f87171;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { overflow-x: clip; -webkit-font-smoothing: antialiased; }
    body {
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      line-height: 1.6; padding-top: 64px;
    }
    code { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    ::selection { background: rgba(139,77,255,.3); color: #fff; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0f1a; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
